<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Vision Link Store Calibrator</title>
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme: dark; --line: #273136; --panel: #1a2225; --purple: #7c3aed; }
      body { margin: 0; min-height: 100vh; background: #050a08; color: white; font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif; }
      button, input, select, textarea { font: inherit; }
      button { border: 0; border-radius: 10px; padding: 11px 13px; background: #2a373d; color: white; font-weight: 800; cursor: pointer; }
      button.active, button.primary { background: linear-gradient(135deg, #6d28d9, #a855f7); }
      button.warn { background: #92400e; }
      .app { display: grid; grid-template-columns: minmax(360px, 470px) minmax(420px, 1fr) 360px; gap: 22px; min-height: 100vh; padding: 22px; }
      .panel { border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: 0 16px 42px rgba(0,0,0,.36); overflow: hidden; }
      .toolbar, .controls { padding: 20px; }
      h1, h2, h3 { margin: 0 0 12px; }
      p { margin: 0 0 16px; color: #9fb0bd; line-height: 1.6; }
      code { color: #ddd6fe; }
      .status { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #101719; color: #cbd5e1; font-size: 13px; }
      .tabs, .actions, .preview-selectors { display: grid; gap: 10px; }
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .preview-selectors { grid-template-columns: repeat(2, 1fr); margin-top: 16px; }
      label { display: block; margin: 14px 0 7px; color: #9fb0bd; font-size: 13px; font-weight: 700; }
      select, input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #101719; color: white; padding: 10px 12px; }
      input[type="range"] { padding: 0; accent-color: #a855f7; }
      .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-top: 16px; max-height: 380px; overflow: auto; padding-right: 4px; }
      .item-card { position: relative; aspect-ratio: 1; padding: 0; border: 2px solid transparent; border-radius: 12px; background: #273136; overflow: hidden; }
      .item-card.active { border-color: #c4b5fd; }
      .item-card.equipped::after { content: "穿戴中"; position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 3px 6px; border-radius: 999px; background: rgba(124,58,237,.9); font-size: 10px; }
      .thumb-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: center; }
      .empty { grid-column: 1/-1; padding: 24px 12px; border: 1px dashed #3c4a50; border-radius: 12px; color: #9fb0bd; text-align: center; line-height: 1.6; }
      .stage-panel { display: grid; place-items: center; min-height: calc(100vh - 44px); background: linear-gradient(180deg, #20133d 0%, #111827 100%); }
      .stage { position: relative; width: min(420px, 92%); aspect-ratio: 408 / 612; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; transform-origin: center; pointer-events: none; }
      .layer-back { z-index: 1; } .template-00 { z-index: 2; } .hair-front { z-index: 4; } .face-front { z-index: 5; } .template-02 { z-index: 6; } .bottoms-front { z-index: 7; } .top-front { z-index: 8; }
      .range-row { margin-top: 14px; }
      .range-row label { display: flex; justify-content: space-between; gap: 10px; }
      .actions { grid-template-columns: repeat(2,1fr); margin-top: 18px; }
      .output { min-height: 180px; margin-top: 14px; resize: vertical; font: 11px/1.45 Consolas, monospace; }
      .target { margin: 12px 0 2px; padding: 10px; border-radius: 10px; background: #101719; color: #ddd6fe; font-size: 13px; overflow-wrap: anywhere; }
      @media (max-width: 1120px) { .app { grid-template-columns: 1fr 1fr; } .controls-panel { grid-column: 1/-1; } }
      @media (max-width: 760px) { .app { grid-template-columns: 1fr; padding: 10px; } .controls-panel { grid-column: auto; } .stage-panel { min-height: 620px; } }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel toolbar">
        <h1>商城素材校正器</h1>
        <p>操作方式與 Avatar 校正器相同。素材從 <code>public/store</code> 的 01 開始自動讀取。</p>
        <div id="scan-status" class="status">正在讀取素材…</div>

        <div id="preview-selectors" class="preview-selectors"></div>
        <div id="tabs" class="tabs" style="margin-top:18px"></div>
        <div id="item-grid" class="grid"></div>

        <div class="actions">
          <button id="rescan">重新讀取資料夾</button>
          <button id="save-target" class="primary">儲存目前目標</button>
          <button id="reset-target">重置目前目標</button>
          <button id="copy-output" class="primary">複製匯出碼</button>
        </div>
      </section>

      <section class="panel stage-panel">
        <div id="stage" class="stage"></div>
      </section>

      <section class="panel controls-panel">
        <div class="controls">
          <h2>相對位置與大小</h2>
          <div id="target-label" class="target">尚未選擇素材</div>

          <label>商城造型名稱（同編號四個部位共用）</label>
          <input id="outfit-name" type="text" maxlength="30" placeholder="例如：荒野牛仔" />

          <label>圖層</label>
          <select id="layer-select">
            <option value="front">前層</option>
            <option value="back">後層</option>
          </select>

          <div class="range-row"><label>大小 <span id="scale-value">1.00</span></label><input id="scale" type="range" min="0.2" max="1.8" step="0.01" /></div>
          <div class="range-row"><label>水平位置 <span id="x-value">0.00</span></label><input id="x-pct" type="range" min="-60" max="60" step="0.05" /></div>
          <div class="range-row"><label>垂直位置 <span id="y-value">0.00</span></label><input id="y-pct" type="range" min="-60" max="60" step="0.05" /></div>

          <h3 style="margin-top:24px">讀取規則</h3>
          <p>
            頭部：<code>hair/頭髮01.png</code>，或 <code>頭髮01-1.png</code>＋<code>頭髮01-2.png</code><br />
            臉部：<code>face/表情01.png</code><br />
            上半身：<code>top/上衣01.png</code><br />
            下半身：<code>bottoms/褲裝01.png</code>
          </p>
          <p>模板固定使用原本 Avatar 的 <code>模板00.png</code> 與 <code>模板02.png</code>，疊放順序也與原本 Avatar 校正器相同。</p>
          <textarea id="export-output" class="output" readonly></textarea>
        </div>
      </section>
    </main>

    <script>
      const STORE_BASE = "public/store";
      const AVATAR_TEMPLATE_BASE = "public/avatar-assets/templates";
      const STORAGE_KEY = "arvl_store_relative_settings_v3";
      const NAME_STORAGE_KEY = "arvl_store_outfit_names_v1";
      const categories = [
        { key: "template", label: "模板" },
        { key: "hair", label: "頭部" },
        { key: "face", label: "臉部" },
        { key: "top", label: "上半身" },
        { key: "bottoms", label: "下半身" },
      ];
      const prefixes = { hair: "頭髮", face: "表情", top: "上衣", bottoms: "褲裝" };
      const state = {
        category: "hair",
        targetId: "",
        layer: "front",
        items: { template: [], hair: [], face: [], top: [], bottoms: [] },
        preview: { hair: "", face: "", top: "", bottoms: "" },
        settings: loadSettings(),
        names: loadNames(),
        draftKey: "",
        draftSetting: null,
      };

      function loadSettings() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
        catch { return {}; }
      }

      function loadNames() {
        try { return JSON.parse(localStorage.getItem(NAME_STORAGE_KEY) || "{}"); }
        catch { return {}; }
      }

      function defaultSetting(itemId = "") {
        if (itemId === "template-00") return { scale: 1, x_pct: 0, y_pct: -0.7 };
        if (itemId === "template-02") return { scale: 1, x_pct: 0, y_pct: 0.3 };
        return { scale: 1, x_pct: 0, y_pct: 0 };
      }
      function fileUrl(path) { return path; }

      function imageExists(path) {
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(path);
          image.onerror = () => resolve("");
          image.src = fileUrl(path);
        });
      }

      async function firstExisting(paths) {
        for (const path of paths) {
          if (await imageExists(path)) return path;
        }
        return "";
      }

      async function discoverTemplates() {
        const definitions = [
          ["template-00", "模板00", "模板00.png", "template-00"],
          ["template-02", "模板02", "模板02.png", "template-02"],
        ];
        const result = [];
        for (const [id, label, filename, className] of definitions) {
          const img = await firstExisting([`${AVATAR_TEMPLATE_BASE}/${filename}`]);
          if (img) result.push({ id, label, img, className });
        }
        return result;
      }

      async function discoverCategory(category) {
        const items = [];
        let misses = 0;
        for (let index = 1; index <= 99 && misses < 5; index += 1) {
          const number = String(index).padStart(2, "0");
          const prefix = prefixes[category];
          let front = "";
          let back = "";

          if (category === "hair") {
            front = await firstExisting([
              `${STORE_BASE}/hair/${prefix}${number}-1.png`,
              `${STORE_BASE}/hair/${number}-1.png`,
              `${STORE_BASE}/hair/${prefix}${number}.png`,
              `${STORE_BASE}/hair/${number}.png`,
            ]);
            back = await firstExisting([
              `${STORE_BASE}/hair/${prefix}${number}-2.png`,
              `${STORE_BASE}/hair/${number}-2.png`,
            ]);
          } else {
            front = await firstExisting([
              `${STORE_BASE}/${category}/${prefix}${number}.png`,
              `${STORE_BASE}/${category}/${number}.png`,
            ]);
          }

          if (front) {
            items.push({
              id: `store-outfit-${number}-${category}`,
              number,
              label: `${categories.find((entry) => entry.key === category).label} ${number}`,
              frontImg: front,
              ...(back ? { backImg: back } : {}),
            });
            misses = 0;
          } else {
            misses += 1;
          }
        }
        return items;
      }

      async function scanAssets() {
        document.getElementById("scan-status").textContent = "正在讀取素材…";
        const [templates, hair, face, top, bottoms] = await Promise.all([
          discoverTemplates(),
          discoverCategory("hair"),
          discoverCategory("face"),
          discoverCategory("top"),
          discoverCategory("bottoms"),
        ]);
        state.items = { template: templates, hair, face, top, bottoms };

        ["hair", "face", "top", "bottoms"].forEach((category) => {
          if (!state.items[category].some((item) => item.id === state.preview[category])) {
            state.preview[category] = state.items[category][0]?.id || "";
          }
        });
        if (!state.items[state.category].some((item) => item.id === state.targetId)) {
          state.targetId = state.items[state.category][0]?.id || "";
        }
        state.layer = "front";
        startDraft();

        const total = hair.length + face.length + top.length + bottoms.length;
        document.getElementById("scan-status").textContent =
          `已讀取 ${templates.length} 張模板、${total} 個商城素材`;
        renderAll();
      }

      function currentList() { return state.items[state.category] || []; }
      function currentItem() { return currentList().find((item) => item.id === state.targetId) || null; }
      function settingKey() { return state.category === "template" ? state.targetId : `${state.targetId}_${state.layer}`; }
      function savedSetting(itemId, layer = "front") {
        const key = itemId.startsWith("template-") ? itemId : `${itemId}_${layer}`;
        return { ...defaultSetting(itemId), ...(state.settings[key] || {}) };
      }
      function displaySetting(itemId, layer = "front") {
        const key = itemId.startsWith("template-") ? itemId : `${itemId}_${layer}`;
        return state.draftKey === key && state.draftSetting
          ? state.draftSetting
          : savedSetting(itemId, layer);
      }
      function startDraft() {
        state.draftKey = settingKey();
        state.draftSetting = state.targetId ? { ...savedSetting(state.targetId, state.layer) } : defaultSetting();
      }
      function applyStyle(element, setting) {
        element.style.transform = `translate(${Number(setting.x_pct) || 0}%, ${Number(setting.y_pct) || 0}%) scale(${Number(setting.scale) || 1})`;
      }
      function appendImage(parent, src, className, setting) {
        if (!src) return;
        const image = document.createElement("img");
        image.className = className;
        image.src = src;
        applyStyle(image, setting);
        parent.appendChild(image);
      }

      function renderStage() {
        const stage = document.getElementById("stage");
        stage.innerHTML = "";
        ["bottoms", "top", "face", "hair"].forEach((category) => {
          const item = state.items[category].find((entry) => entry.id === state.preview[category]);
          if (item?.backImg) appendImage(stage, item.backImg, "layer layer-back", displaySetting(item.id, "back"));
        });
        const base = state.items.template.find((item) => item.id === "template-00");
        const body = state.items.template.find((item) => item.id === "template-02");
        if (base) appendImage(stage, base.img, "layer template-00", displaySetting(base.id));
        const hair = state.items.hair.find((item) => item.id === state.preview.hair);
        const face = state.items.face.find((item) => item.id === state.preview.face);
        const top = state.items.top.find((item) => item.id === state.preview.top);
        const bottoms = state.items.bottoms.find((item) => item.id === state.preview.bottoms);
        if (hair) appendImage(stage, hair.frontImg, "layer hair-front", displaySetting(hair.id));
        if (face) appendImage(stage, face.frontImg, "layer face-front", displaySetting(face.id));
        if (body) appendImage(stage, body.img, "layer template-02", displaySetting(body.id));
        if (bottoms) appendImage(stage, bottoms.frontImg, "layer bottoms-front", displaySetting(bottoms.id));
        if (top) appendImage(stage, top.frontImg, "layer top-front", displaySetting(top.id));
      }

      function renderPreviewSelectors() {
        const wrap = document.getElementById("preview-selectors");
        wrap.innerHTML = "";
        ["hair", "face", "top", "bottoms"].forEach((category) => {
          const box = document.createElement("div");
          const label = document.createElement("label");
          label.textContent = categories.find((item) => item.key === category).label;
          const select = document.createElement("select");
          const noneOption = document.createElement("option");
          noneOption.value = "";
          noneOption.textContent = "不穿（本地預覽）";
          select.appendChild(noneOption);
          state.items[category].forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.label;
            select.appendChild(option);
          });
          select.value = state.preview[category];
          select.disabled = state.items[category].length === 0;
          select.onchange = () => { state.preview[category] = select.value; renderStage(); renderGrid(); exportCode(); };
          box.append(label, select);
          wrap.appendChild(box);
        });
      }

      function renderTabs() {
        const wrap = document.getElementById("tabs");
        wrap.innerHTML = "";
        categories.forEach((category) => {
          const button = document.createElement("button");
          button.textContent = `${category.label} (${state.items[category.key].length})`;
          button.className = state.category === category.key ? "active" : "";
          button.onclick = () => {
            state.category = category.key;
            state.targetId = state.items[category.key][0]?.id || "";
            state.layer = "front";
            startDraft();
            renderAll();
          };
          wrap.appendChild(button);
        });
      }

      function renderGrid() {
        const grid = document.getElementById("item-grid");
        grid.innerHTML = "";
        const list = currentList();
        if (!list.length) {
          grid.innerHTML = '<div class="empty">這個資料夾目前沒有符合命名規則的素材。</div>';
          return;
        }
        list.forEach((item) => {
          const button = document.createElement("button");
          const equipped = state.category !== "template" && state.preview[state.category] === item.id;
          button.className = `item-card ${state.targetId === item.id ? "active" : ""} ${equipped ? "equipped" : ""}`;
          if (state.category === "template") {
            appendImage(button, item.img, "thumb-layer", displaySetting(item.id));
          } else {
            if (item.backImg) appendImage(button, item.backImg, "thumb-layer", displaySetting(item.id, "back"));
            appendImage(button, item.frontImg, "thumb-layer", displaySetting(item.id, "front"));
          }
          button.onclick = () => {
            state.targetId = item.id;
            if (state.category !== "template") {
              state.preview[state.category] =
                state.preview[state.category] === item.id ? "" : item.id;
            }
            state.layer = "front";
            startDraft();
            renderAll();
          };
          grid.appendChild(button);
        });
      }

      function renderControls() {
        const item = currentItem();
        const outfitNameInput = document.getElementById("outfit-name");
        const select = document.getElementById("layer-select");
        const hasBack = state.category !== "template" && Boolean(item?.backImg);
        if (!hasBack) state.layer = "front";
        select.disabled = !hasBack;
        select.value = state.layer;
        document.getElementById("target-label").textContent = item
          ? `目前校準：${item.label}${state.category === "template" ? "" : ` / ${state.layer === "front" ? "前層" : "後層"}`}`
          : "尚未選擇素材";
        const canNameOutfit = state.category !== "template" && Boolean(item?.number);
        outfitNameInput.disabled = !canNameOutfit;
        outfitNameInput.value = canNameOutfit ? state.names[item.number] || "" : "";
        const value = item ? displaySetting(item.id, state.layer) : defaultSetting();
        [["scale", "scale-value", value.scale], ["x-pct", "x-value", value.x_pct], ["y-pct", "y-value", value.y_pct]].forEach(([inputId, valueId, next]) => {
          const input = document.getElementById(inputId);
          input.value = next;
          input.disabled = !item;
          document.getElementById(valueId).textContent = Number(next).toFixed(2);
        });
      }

      function completeNumbers() {
        const sets = ["hair", "face", "top", "bottoms"].map((category) => new Set(state.items[category].map((item) => item.number)));
        return [...sets[0]].filter((number) => sets.every((set) => set.has(number))).sort();
      }

      function relativeStorePath(fullPath) {
        return fullPath.replace(/^public\//, "");
      }

      function catalogSource() {
        return completeNumbers().map((number) => {
          const outfitName = String(state.names[number] || "").trim();
          const pieces = {};
          ["hair", "face", "top", "bottoms"].forEach((category) => {
            const item = state.items[category].find((entry) => entry.number === number);
            pieces[category] = {
              id: item.id,
              label: `${outfitName || `套裝 ${number}`}・${categories.find((entry) => entry.key === category).label}`,
              front: relativeStorePath(item.frontImg),
              ...(item.backImg ? { back: relativeStorePath(item.backImg) } : {}),
            };
          });
          return {
            id: `outfit-${number}`,
            name: outfitName,
            badge: "NEW",
            published: true,
            pieces,
            settings: Object.fromEntries(Object.entries(state.settings).filter(([key]) => key.startsWith(`store-outfit-${number}-`))),
          };
        });
      }

      function exportCode() {
        const code = `// 商城上架資料的唯一來源。\n// 由 store-outfit-calibrator.html 依 public/store 素材產生。\nexport const STORE_CATALOG_SOURCE = ${JSON.stringify(catalogSource(), null, 2)};\n`;
        document.getElementById("export-output").value = code;
        return code;
      }

      function renderAll() {
        renderPreviewSelectors();
        renderTabs();
        renderGrid();
        renderControls();
        renderStage();
        exportCode();
      }

      function updateDraft() {
        if (!currentItem()) return;
        state.draftSetting = {
          scale: Number(document.getElementById("scale").value),
          x_pct: Number(document.getElementById("x-pct").value),
          y_pct: Number(document.getElementById("y-pct").value),
        };
        renderControls();
        renderGrid();
        renderStage();
        exportCode();
      }

      document.getElementById("layer-select").onchange = (event) => { state.layer = event.target.value; startDraft(); renderAll(); };
      document.getElementById("outfit-name").addEventListener("input", (event) => {
        const item = currentItem();
        if (state.category === "template" || !item?.number) return;
        state.names[item.number] = event.target.value;
        exportCode();
      });
      ["scale", "x-pct", "y-pct"].forEach((id) => document.getElementById(id).addEventListener("input", updateDraft));
      document.getElementById("rescan").onclick = scanAssets;
      document.getElementById("save-target").onclick = () => {
        if (!currentItem()) return;
        state.settings[settingKey()] = { ...state.draftSetting };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.settings));
        localStorage.setItem(NAME_STORAGE_KEY, JSON.stringify(state.names));
        startDraft();
        renderAll();
        alert("已儲存目前素材設定。");
      };
      document.getElementById("reset-target").onclick = () => { if (!currentItem()) return; state.draftSetting = defaultSetting(currentItem().id); renderAll(); };
      document.getElementById("copy-output").onclick = async () => {
        const code = exportCode();
        try {
          await navigator.clipboard.writeText(code);
          alert("已複製匯出碼。");
        } catch {
          const output = document.getElementById("export-output");
          output.focus();
          output.select();
          document.execCommand("copy");
          alert("已複製匯出碼。");
        }
      };

      scanAssets();
    </script>
  </body>
</html>
